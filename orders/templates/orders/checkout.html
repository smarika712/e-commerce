{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | Bazaario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

<nav class="main-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'product_list' %}" class="brand-logo">
            <i class="bi bi-bag-check"></i> Bazaario
        </a>
    </div>
</nav>

<div class="container cart-page mt-4 mb-5">
    <h2 class="cart-title">Checkout</h2>

    <div class="row g-4">
        <div class="col-lg-7">
            <div class="cart-panel">
                <h5 class="mb-3">Shipping Details</h5>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" name="full_name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Phone Number</label>
                        <input type="tel" name="phone" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <textarea name="address" class="form-control" rows="2" required></textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">City</label>
                        <input type="text" name="city" class="form-control" required>
                    </div>

                    <h5 class="mb-3 mt-4">Payment Method</h5>
                    <div class="mb-3">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="radio" name="payment_method" value="cod" id="payCod" checked>
                            <label class="form-check-label" for="payCod">
                                Cash on Delivery
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="payment_method" value="esewa" id="payEsewa">
                            <label class="form-check-label" for="payEsewa">
                                Pay with eSewa
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="checkout-btn">Place Order</button>
                </form>
            </div>
        </div>

        <div class="col-lg-5">
            <div class="summary-panel">
                <h5 class="summary-title">Order Summary</h5>
                {% for item in cart_items %}
                <div class="summary-row">
                    <span>{{ item.product.name }} × {{ item.quantity }}</span>
                    <span>Rs. {{ item.subtotal|floatformat:2 }}</span>
                </div>
                {% endfor %}
                <div class="summary-row grand-total-row">
                    <span>Total</span>
                    <span class="grand-total-amount">Rs. {{ total|floatformat:2 }}</span>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
