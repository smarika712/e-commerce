{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed | Bazaario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

<div class="container mt-5 mb-5" style="max-width:600px;">
    <div class="text-center">
        <i class="bi bi-check-circle-fill text-success" style="font-size:3.5rem;"></i>
        <h3 class="mt-3">Order Placed Successfully!</h3>
        <p class="text-muted">Order ID: {{ order.order_id }}</p>
        <p class="text-muted">
            {% if order.payment_method == 'cod' %}
                You'll pay Rs. {{ order.total_amount }} on delivery.
            {% else %}
                Payment status: {{ order.get_status_display }}
            {% endif %}
        </p>
        <a href="{% url 'product_list' %}" class="btn-brand mt-2">Continue Shopping</a>
    </div>
</div>

</body>
</html>
