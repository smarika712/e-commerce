{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
    <script src="{% static 'js/script.js' %}"></script>
</head>
<body>

<div class="announce-bar">
    Free shipping over Rs. 2000 &nbsp;|&nbsp; Secure checkout &nbsp;|&nbsp; 24/7 support
</div>

<nav class="main-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'product_list' %}" class="brand-logo">
            <i class="bi bi-bag-check"></i>
            <div>
                Bazaario
                <span class="brand-tagline">Shop smart, live well</span>
            </div>
        </a>

        <div class="nav-links d-none d-md-flex">
            <a href="{% url 'product_list' %}">Home</a>
            <a href="{% url 'product_list' %}">Shop</a>
            <a href="{% url 'product_create' %}">Add Product</a>
        </div>

        <div class="nav-icons d-flex align-items-center">
            <a href="#"><i class="bi bi-search"></i></a>
            <a href="{% url 'logout' %}"><i class="bi bi-person"></i></a>
            <a href="#">
                <i class="bi bi-cart3"></i>
                <span class="cart-badge">0</span>
            </a>
        </div>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="danger-card fade-in-target">
                <h4 class="mb-2"> Delete "{{ product.name }}"?</h4>
                <p class="text-muted">This action cannot be undone.</p>
                <form id="delete-form" method="post">
                    {% csrf_token %}
                    <div class="d-flex justify-content-center gap-2 mt-3">
                        <button type="submit" class="btn btn-danger">Confirm Delete</button>
                        <a href="{% url 'product_detail' product.slug %}" class="btn-brand">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="{% static 'products/js/script.js' %}"></script>
</body>
</html>
