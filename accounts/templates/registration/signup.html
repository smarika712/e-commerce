{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up | Bazaario</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <link href="{% static 'css/style.css' %}" rel="stylesheet">
</head>
<body>

<nav class="main-navbar">
    <div class="container d-flex justify-content-between align-items-center">
        <a href="{% url 'product_list' %}" class="brand-logo">
            <i class="bi bi-bag-check"></i> Bazaario
        </a>
    </div>
</nav>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="auth-card">
                <h2 class="mb-1">Create your account</h2>
                <p class="auth-subtitle">Join Bazaario to start shopping</p>

                {% if form.errors %}
                <div class="alert alert-danger py-2 small">
                    Please fix the errors below.
                </div>
                {% endif %}

                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn-brand w-100 mt-2">Sign Up</button>
                </form>

                <p class="auth-switch">
                    Already have an account? <a href="{% url 'login' %}">Login</a>
                </p>
            </div>
        </div>
    </div>
</div>

</body>
</html>
